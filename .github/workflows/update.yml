name: Update Vavoo Croatia Playlist

on:
  schedule:
    - cron: '0 */6 * * *'   # svakih 6 sati
  workflow_dispatch:        # ručno pokretanje preko GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run fetch script
        run: python fetch_croatia.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vavoo_croatia.m3u
          git diff --staged --quiet || git commit -m "Update Vavoo Croatia playlist [skip ci]"
          git push
