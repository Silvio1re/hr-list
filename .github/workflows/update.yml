name: Auto-update M3U and EPG

on:
  schedule:
    - cron: '0 */6 * * *'   # svakih 6 sati
  workflow_dispatch:         # ručno pokretanje

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate M3U
        run: python generate.py

      - name: Generate EPG
        run: python generateepg.py

      - name: Commit and push updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vavoo_hrvatska_lista.m3u epg.xml 2>/dev/null || true
          git commit -m "Auto-update M3U and EPG [skip ci]" || echo "No changes to commit"
          git push
