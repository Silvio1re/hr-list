name: Update Croatia VAVOO channels

on:
  schedule:
    - cron: 'X * * * *'   # svakih sat vremena (optimalno)
  workflow_dispatch:       # ručno pokretanje

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run fetch script
        run: python fetch_croatia.py

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add vavoo_croatia.m3u
          git diff --staged --quiet || (git commit -m "Update Croatia VAVOO channels" && git push)
