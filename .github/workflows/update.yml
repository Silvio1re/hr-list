name: Update Croatia VAVOO channels (direct API)

on:
  schedule:
    - cron: '0 * * * *'   # svakih 15 minuta (možeš promijeniti)
  workflow_dispatch:         # omogućava ručno pokretanje

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run fetch script
        run: python fetch_croatia.py

      - name: Commit and push if changed
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git remote set-url origin https://x-access-token:${PAT_TOKEN}@github.com/${{ github.repository }}.git
          git add vavoo_croatia_direct.m3u
          git diff --staged --quiet || (git commit -m "Update Croatia VAVOO channels (direct API)" && git push)
